input {
  # Простой вход для тестов (можно слать данные через curl)
  beats {
    port => 5044
  }
}

filter {
  # 1. Если лог уже пришел как JSON, разбираем его
  if [message] =~ /^\{.*/ {
    json {
      source => "message"
    }
  }

  # 2. Если это обычный текст, вытаскиваем уровень лога (grok)
  # Этот паттерн ищет слова INFO, ERROR, WARN и т.д.
  grok {
    match => { "message" => "%{LOGLEVEL:log.level}" }
    # Не удаляем message, если не удалось распарсить
    tag_on_failure => ["_grok_parse_failure"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }
  # Дублируем в консоль контейнера для отладки
  stdout { codec => rubydebug }
}
